spring:
  application:
    name: nextone-server
  datasource:
    url: ${NEXTONE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nextone}
    username: ${NEXTONE_DATABASE_USER:nextone}
    password: ${NEXTONE_DATABASE_PASSWORD:nextone_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

nextone:
  bootstrap:
    enabled: ${NEXTONE_BOOTSTRAP_ENABLED:true}
  single-user:
    id: ${NEXTONE_USER_ID:local-user}
    display-name: ${NEXTONE_USER_NAME:NextOne Owner}
    token: ${NEXTONE_ACCESS_TOKEN:nextone-local-dev-token}
    locale: ${NEXTONE_USER_LOCALE:zh-CN}
    time-zone: ${NEXTONE_USER_TIME_ZONE:Asia/Shanghai}

server:
  port: ${NEXTONE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: NextOne
    version: 0.1.0
