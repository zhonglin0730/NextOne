spring:
  application:
    name: nextone-server
  datasource:
    url: ${NEXTONE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nextone}
    username: ${NEXTONE_DATABASE_USER:nextone}
    password: ${NEXTONE_DATABASE_PASSWORD:nextone_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NEXTONE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

info:
  app:
    name: NextOne
    version: 0.1.0
