services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextone}
      POSTGRES_USER: ${POSTGRES_USER:-nextone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextone_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nextone_postgres_data:/var/lib/postgresql/data

volumes:
  nextone_postgres_data:
